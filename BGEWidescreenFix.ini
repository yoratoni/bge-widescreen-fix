; Beyond Good & Evil - 20th Anniversary Edition, widescreen fix
; Every key is optional, a missing key keeps its default value.

[General]
; Master switch (0 = the ASI loads but patches nothing)
Enabled = 1

[Fixes]
; Keep the render target at the window size instead of the game's 16:9 fit
ForceRenderSize = 1
; Make every view fit inside the screen (stock: overflow), needed by the 2D layers
FitInside = 1
; Keep the 16:9 vertical field of view and widen the horizontal one
HorPlus = 1
; Correct the size of the text layer
TextFix = 1
; Center the 16:9 area every 2D layer (menus, HUD, text, fades, loading screens) is drawn in
CenterFittedOffsets = 1

[Debug]
; Log every distinct view going through the viewport fit (camera flags, ratio index, viewport size and fractions),
; once when it first appears
LogFittedViews = 0
